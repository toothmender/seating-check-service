# Render Blueprint: deploys this folder's Dockerfile as one web service.
# Render asks for the values marked sync: false when you create the Blueprint; they are stored as secrets, not in the image.
services:
  - type: web
    name: seating-check
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Google sign-in, limited to @meetdandy.com. Takes priority over the shared login below
      # once GOOGLE_CLIENT_ID is set. Set the client ID and secret in Render's Environment page.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAIL_DOMAIN
        value: meetdandy.com
      - key: SESSION_SECRET
        generateValue: true
      # Shared login: used only while Google sign-in isn't configured.
      - key: ACCESS_USER
        sync: false
      - key: ACCESS_PASSWORD
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: MAX_OUTPUT_TOKENS
        value: "1800"
